# 开发环境
spring:
  # nacos配置，需要改为服务器ip
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER}
        username: ${NACOS_USER}
        password: ${NACOS_PASSWORD}
  ai:
    dashscope:
      api-key: sk-1d81164c57e84d61bf132bec750a5794
      chat:
        options:
          model: qwen-max        # 模型选择，可选 qwen-plus、qwen-turbo、qwen3.5-plus
          temperature: 0.7       # 创造性（0-1，越高越随机）
          max-tokens: 2048       # 最大输出 Token 数
    retry:
      max-attempts: 3
      initial-interval: 2000
      max-interval: 10000
      multiplier: 2
    mcp:
      client:
        # mcp-server 模块已移至 dcloud-interview-ai-extras/ 另存，本仓库不再需要 MCP 客户端
        enabled: false
        type: SYNC
        request-timeout: 300s
        toolcallback:
          enabled: true
        # 使用Streamable HTTP连接（无状态，适合FC环境）
        streamable-http:
          connections:
            mcp-server:
              url: https://resume-p-server-ccxbudmvcx.cn-hangzhou.fcapp.run
              #url: http://127.0.0.1:8090
              endpoint: /mcp
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  rabbitmq:
    host: ${RABBITMQ_SERVER}
    port: 5672
    virtual-host: /xd_test
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        acknowledge-mode: manual

  # db
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_SERVER}/ai_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      max-lifetime: 300000         # 5分钟，单位毫秒
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 60000
      minimum-idle: 5
      maximum-pool-size: 20
      pool-name: HikariCP
  hikari:
    max-lifetime: 60000
    connection-test-query: SELECT 1  # MySQL 验证语句
  #  redis配置
  data:
    redis:
      host: ${REDIS_SERVER}
      port: 6379
      password: ${REDIS_PASSWORD}
#  锁配置 防止不同环境争抢一把锁
lock:
  prefix-key: dev

# 短信配置
sms:
  app-code: ${SMS_APP_CODE}
  sms-sign-id: 2e65b1bb3d054466b82f0c9d125465e2
  template-id: 908e94ccf08b4476ba6c876d13f084ad


mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: net.abing.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: false

springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: net.abing.controller
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true


# 阿里云OSS配置
aliyun:
  oss:
    secure-endpoint: oss-cn-beijing.aliyuncs.com    # 加密bucket访问域名
    access-key-id: ${OSS_ACCESS_KEY_ID}           # 访问密钥ID
    access-key-secret: ${OSS_ACCESS_KEY_SECRET}     # 访问密钥Secret
    secure-bucket-name: dcloud-interview-pri          # 加密访问的存储桶
    secure-domain: https://test-file-pri.znoffer.com        # 加密访问的域名
    public-endpoint: oss-cn-beijing.aliyuncs.com    # 公开bucket访问域名
    public-bucket-name: dcloud-interview-pub         # 公开访问的存储桶（头像/题图）
    public-domain: https://test-file-pub.znoffer.com  # 公开访问域名


