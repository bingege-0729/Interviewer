# SearXNG 搜索引擎配置
searxng:
  base-url: http://127.0.0.1:8081  # SearXNG 服务地址（本地未部署时可不填，仅 AI 搜索功能用到）
  format: json                          # 返回格式，必须为 json
  language: zh                          # 搜索语言
  engines: bing,baidu                        # 搜索引擎（多个用逗号分隔，如：bing,google）