# 本地中间件一键启动（Nacos / Redis / RabbitMQ）
# 说明：
#   - 本机 MySQL 8 已在 3306 运行，故这里不启 MySQL，由你在本地建库导 SQL。
#   - 所有地址均为 127.0.0.1，与后端 application-prod.yml 中的 127.0.0.1 对应。
#   - 账号密码刻意对齐后端配置，后端几乎无需改动：
#       Redis:   password abc123456
#       RabbitMQ: user root / pass abc123456 （vhost 默认 /）
#       Nacos:   关闭鉴权，后端用 nacos/nacos123 也能注册
# 用法：先打开 Docker Desktop，再在仓库根目录执行  docker compose up -d
services:
  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: dcloud-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
      - JVM_XMS=512m
      - JVM_XMX=512m
    ports:
      - "8849:8848"
      - "9849:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2-alpine
    container_name: dcloud-redis
    command: ["redis-server", "--requirepass", "abc123456"]
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: dcloud-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=root
      - RABBITMQ_DEFAULT_PASS=abc123456
    ports:
      - "5672:5672"
      - "15672:15672"
